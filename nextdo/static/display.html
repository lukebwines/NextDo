<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NextDo Display</title><link rel="stylesheet" href="../assets/style.css"></head><body><main class="main" style="max-width:1700px"><div class="top"><div><h1>✓ NextDo Display</h1><p class="sub" id="clock"></p></div><button class="btn" onclick="document.documentElement.requestFullscreen?.()">Schermo intero</button></div><div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><label>Da gestire</label><strong id="total">—</strong></div><div class="stat"><label>Urgenti</label><strong id="urgent">—</strong></div><div class="stat"><label>Scadute</label><strong id="overdue">—</strong></div></div><section class="card" style="margin-top:20px"><h2 id="name">Scadenze pubblicate</h2><div id="entries" class="empty">Caricamento…</div></section></main><script>const token=decodeURIComponent(location.pathname.split('/').pop());const priority={critical:'Critica',high:'Alta',normal:'Normale',low:'Bassa'};async function load(){document.getElementById('clock').textContent=new Date().toLocaleString('it-IT');try{const r=await fetch('../../api/display/'+encodeURIComponent(token),{cache:'no-store'});if(!r.ok)throw Error('Monitor non autorizzato');const d=await r.json();document.getElementById('name').textContent=d.display;document.getElementById('total').textContent=d.tasks.length;document.getElementById('urgent').textContent=d.tasks.filter(t=>['critical','high'].includes(t.priority)).length;document.getElementById('overdue').textContent=d.tasks.filter(t=>t.due_at&&new Date(t.due_at)<new Date()).length;const box=document.getElementById('entries');box.textContent='';if(!d.tasks.length){box.textContent='Nessuna scadenza pubblicata';return}d.tasks.forEach(t=>{const row=document.createElement('div');row.className='rowtask';const main=document.createElement('div');main.className='taskmain';const title=document.createElement('div');title.className='tasktitle';title.style.fontSize='clamp(18px,2vw,30px)';title.textContent=t.title;const due=document.createElement('div');due.className='muted';due.textContent=t.due_at?new Date(t.due_at).toLocaleString('it-IT'):'Senza scadenza';main.append(title,due);const b=document.createElement('span');b.className='pill '+t.priority;b.textContent=priority[t.priority]||t.priority;row.append(main,b);box.append(row)})}catch(e){document.getElementById('entries').textContent=e.message}}load();setInterval(load,30000)</script></body></html>
