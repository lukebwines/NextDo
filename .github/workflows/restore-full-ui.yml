name: Restore NextDo full UI source
on:
  push:
    branches:
      - restore/full-ui-from-local-011
    paths:
      - .github/workflows/restore-full-ui.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore/full-ui-from-local-011
          persist-credentials: true
      - name: Check and extract original source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .restore-payload/part{0..6}.b64 | base64 --decode > /tmp/nextdo-source.tgz
          echo "903003931fac47e4fe60eac3d63814be0248add0653043aacd526c6dbf89c709  /tmp/nextdo-source.tgz" | sha256sum -c -
          tar -tzf /tmp/nextdo-source.tgz | tee /tmp/file-list.txt
          if grep -E '(^/|\.\./)' /tmp/file-list.txt; then echo 'Unsafe archive entries'; exit 1; fi
          tar -xzf /tmp/nextdo-source.tgz
          python -m py_compile nextdo/app/main.py
          node --check nextdo/static/app.js
          grep -q 'version: "0.1.3-test"' nextdo/config.yaml
      - name: Run fresh installation and migration tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r nextdo/requirements.txt pytest httpx
          PYTHONPATH=nextdo python -m pytest -q tests/test_api.py
      - name: Publish restored source files to this branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .restore-payload
          rm .github/workflows/restore-full-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "restore: full NextDo UI and backend with validated migration"
          git push origin HEAD:restore/full-ui-from-local-011
