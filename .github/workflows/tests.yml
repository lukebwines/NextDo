name: NextDo local API tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r nextdo/requirements.txt pytest httpx
      - run: python -m compileall -q nextdo/app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check nextdo/static/app.js
      - run: node --check nextdo/static/file-tools.js
      - run: node --check nextdo/static/workspace-ui.js
      - run: node --check nextdo/static/gantt.js
      - run: node --check nextdo/static/progress-ui.js
      - run: PYTHONPATH=nextdo pytest -q tests
