name: NextDo Android — release firmata
on:
  push:
    branches: [main]
    paths:
      - 'android/app/build.gradle.kts'
  workflow_dispatch:
    inputs:
      notes:
        description: "Novità della versione"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: android-signed-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Publish Android 0.2.13-test:'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verifica configurazione firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Configurare ANDROID_KEYSTORE_B64 e ANDROID_KEYSTORE_PASSWORD nei secrets del repository."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android :app:testReleaseUnitTest :app:assembleRelease :app:lintRelease --no-daemon
      - name: Firma APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ks="$(mktemp)"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ks"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p dist
          "$tools/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/nextdo-aligned.apk"
          "$tools/apksigner" sign --ks "$ks" --ks-key-alias nextdo-viaggi \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out dist/nextdo-viaggi.apk "$RUNNER_TEMP/nextdo-aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs dist/nextdo-viaggi.apk
      - name: Genera metadati
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re, os
          gradle = pathlib.Path("android/app/build.gradle.kts").read_text()
          version = re.search(r'versionName\s*=\s*"([^"]+)"', gradle).group(1)
          code = int(re.search(r'versionCode\s*=\s*(\d+)', gradle).group(1))
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:-test)?', version)
          sha = hashlib.sha256(pathlib.Path("dist/nextdo-viaggi.apk").read_bytes()).hexdigest()
          pathlib.Path("dist/nextdo-viaggi.json").write_text(json.dumps({
              "packageName": "uk.archis.nextdoviaggi", "versionName": version,
              "versionCode": code, "sha256": sha
          }))
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("ANDROID_VERSION=" + version + "\n")
          PY
      - name: Pubblica release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$ANDROID_VERSION" = "0.2.13-test"
            RELEASE_NOTES="Flight Status sperimentale: apertura dettaglio e controllo su richiesta, confronto Airportia con data/numero/tratta, partenza e arrivo separati. Nessun monitoraggio periodico. Include le funzionalità della versione precedente. Web 0.2.18-test richiesto; aggiornare prima il server."
          fi
          tag="android-v$ANDROID_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::La versione esiste già. Incrementare versionCode e versionName."
            exit 1
          fi
          gh release create "$tag" dist/nextdo-viaggi.apk dist/nextdo-viaggi.json \
            --target "$GITHUB_SHA" --title "NextDo Android $ANDROID_VERSION" \
            --notes "$RELEASE_NOTES" --prerelease --latest=false
